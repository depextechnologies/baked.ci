services:
  postgres:
    image: postgres:16.10
    container_name: baked-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - baked


  backend:
    container_name: baked-backend

    build:
      context: ./backend

    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    init: true

    stop_grace_period: 30s

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy

    # Backend is accessible only inside Docker network
    expose:
      - "8001"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - baked


  frontend:
    container_name: baked-frontend

    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
        REACT_APP_GOOGLE_MAPS_API_KEY: ${REACT_APP_GOOGLE_MAPS_API_KEY}

    restart: unless-stopped

    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}

    depends_on:
      backend:
        condition: service_healthy

    # HTTP (redirect + ACME challenge) and HTTPS
    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Let's Encrypt ACME challenge files
      - certbot_www:/var/www/certbot

      # SSL certificates
      - certbot_certs:/etc/letsencrypt:ro

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - baked


  certbot:
    image: certbot/certbot:latest
    container_name: baked-certbot

    volumes:
      # ACME challenge files shared with Nginx
      - certbot_www:/var/www/certbot

      # Let's Encrypt certificates
      - certbot_certs:/etc/letsencrypt

    networks:
      - baked


networks:
  baked:
    driver: bridge


volumes:
  postgres_data:
  certbot_www:
  certbot_certs: