# Minimal Redis config for SENDbakēd realtime pub/sub.
#
# We use Redis ONLY as a WebSocket fan-out broker — NOT as durable
# storage. Postgres remains the source of truth. Everything below is
# tuned for lowest-latency in-memory pub/sub on a single node:
#
#   * bind 127.0.0.1 → not exposed outside the pod
#   * appendonly / RDB snapshots disabled — nothing to persist
#   * maxmemory 128mb + noeviction — pub/sub uses ~0 bytes of key
#     storage; the ceiling is just belt-and-braces against a memory bug
#   * tcp-keepalive 60 → keep long-lived subscribers alive across NAT

bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 511
tcp-keepalive 60
timeout 0

daemonize no
supervised no

loglevel notice
logfile ""

# Disable both RDB and AOF — no persistence needed.
save ""
appendonly no
stop-writes-on-bgsave-error no

maxmemory 128mb
maxmemory-policy noeviction

# Small ID limits — nothing here needs many databases.
databases 1
